<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B1221">
  <title>WINGS — Build Your Wings | صمّم وجبتك (المدية)</title>
  
  <!-- Google Font: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       RESET & BASE THEME VARIABLES
       ========================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-midnight: #0B1221;
      --bg-surface: #131E33;
      --bg-surface-elevated: #1B2945;
      --brand-orange: #F94E1E;
      --brand-orange-hover: #E03E10;
      --brand-gold: #F59E0B;
      --brand-green: #10B981;
      --text-white: #FFFFFF;
      --text-muted: #8E9BAE;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --font-cairo: 'Cairo', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #050810;
      color: var(--text-white);
      font-family: var(--font-cairo);
      direction: rtl;
      text-align: right;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Sleek Mobile Viewport Container */
    .app-viewport {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background-color: var(--bg-midnight);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.06);
      overflow-x: hidden;
    }

    /* Hide scrollbars */
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    /* ==========================================================
       TOP NAVIGATION BAR
       ========================================================== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px 8px;
      z-index: 30;
      position: relative;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: var(--text-white);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .icon-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.12);
    }

    .brand-title-wrap {
      text-align: center;
    }
    .brand-title {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--text-white);
      line-height: 1.1;
    }
    .brand-subtitle {
      font-size: 10px;
      color: var(--brand-orange);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .cart-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background: var(--brand-orange);
      color: white;
      font-size: 10px;
      font-weight: 800;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(249, 78, 30, 0.5);
    }

    /* ==========================================================
       HEADER ROW & MODE SWITCHER (صمّم وجبتك | وجبات جاهزة)
       ========================================================== */
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 18px 10px;
      z-index: 25;
      gap: 12px;
    }

    .header-headline {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-white);
      line-height: 1.2;
    }
    .header-tagline {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .mode-toggle-container {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      padding: 3px;
      display: flex;
      align-items: center;
      position: relative;
      flex-shrink: 0;
    }

    .mode-toggle-btn {
      position: relative;
      z-index: 2;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 9999px;
      transition: color 0.25s ease;
      font-family: var(--font-cairo);
      white-space: nowrap;
    }
    .mode-toggle-btn.active {
      color: #0B1221;
    }

    .mode-slider {
      position: absolute;
      top: 3px;
      bottom: 3px;
      width: 50%;
      background: #FFFFFF;
      border-radius: 9999px;
      z-index: 1;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }
    .mode-slider.ready-pos {
      transform: translateX(-100%);
    }

    /* ==========================================================
       TOP-DOWN ORBITING STAGE (~40% height)
       ========================================================== */
    .stage-container {
      height: 40vh;
      min-height: 295px;
      max-height: 355px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 0 12px;
      border-radius: 28px;
      background: radial-gradient(circle at center, #15223A 0%, #0B1221 72%);
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }

    /* Ambient Glow Behind Plate */
    .plate-ambient-glow {
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(249, 78, 30, 0.15) 0%, transparent 70%);
      transition: all 0.4s ease;
      pointer-events: none;
      z-index: 1;
    }
    .plate-ambient-glow.glow-medium {
      background: radial-gradient(circle, rgba(249, 115, 22, 0.32) 0%, transparent 70%);
      transform: scale(1.18);
    }
    .plate-ambient-glow.glow-extra-hot {
      background: radial-gradient(circle, rgba(239, 68, 68, 0.5) 0%, transparent 70%);
      transform: scale(1.32);
      animation: pulseFieryGlow 1.8s ease-in-out infinite;
    }
    @keyframes pulseFieryGlow {
      0%, 100% { opacity: 0.85; transform: scale(1.3); }
      50% { opacity: 1; transform: scale(1.38); }
    }

    /* Dedicated Full-Size Centered Flex Container for Wings Box (Dead-Center Symmetrical Stage) */
    .wings-center-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
      padding-bottom: 28px; /* Breathing room for horizontal spice bar below */
      padding-top: 14px; /* Clearance for top sauce badge */
    }

    .main-plate-wrap {
      width: 100%;
      max-width: 195px;
      max-height: 165px;
      height: 165px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .plate-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    /* Transparent PNG Wings Box: Strict Bounding Box (Snappy 150ms Scale, Zero Lag) */
    .real-wing-overlay {
      width: 100%;
      height: 100%;
      max-width: 195px;
      max-height: 165px;
      object-fit: contain;
      z-index: 12;
      pointer-events: none;
      filter: drop-shadow(0 14px 22px rgba(0, 0, 0, 0.6));
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      opacity: 1;
      transform-origin: center center;
    }
    .real-wing-overlay.switching {
      opacity: 0.12;
      transform: scale(0.96);
    }

    /* ==========================================================
       SLEEK HORIZONTAL 3-STEP SPICE BAR (Bottom of Visual Stage)
       ========================================================== */
    .spice-bar-wrap {
      position: absolute;
      bottom: 9px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 18, 33, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 3px 4px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 3px;
      z-index: 25;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
    }

    .spice-bar-btn {
      border: 1px solid transparent;
      background: transparent;
      padding: 4px 9px;
      border-radius: 9999px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 800;
      font-family: var(--font-cairo);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }
    .spice-bar-btn:active {
      transform: scale(0.95);
    }
    .spice-bar-btn.active.mild {
      background: rgba(16, 185, 129, 0.18);
      color: #10B981;
      border-color: rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
    }
    .spice-bar-btn.active.medium {
      background: rgba(249, 115, 22, 0.2);
      color: #F97316;
      border-color: rgba(249, 115, 22, 0.45);
      box-shadow: 0 0 12px rgba(249, 115, 22, 0.28);
    }
    .spice-bar-btn.active.extra-hot {
      background: rgba(239, 68, 68, 0.24);
      color: #EF4444;
      border-color: rgba(239, 68, 68, 0.55);
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.4);
    }

    .spice-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    @keyframes steamDrift {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      40% { opacity: 0.6; }
      100% { transform: translateY(-30px) scale(1.3); opacity: 0; }
    }
    .steam-line {
      animation: steamDrift 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* ==========================================================
       DIPS ZONE: DEDICATED 2-COLUMN COMPACT MINI-CLUSTER (LEFT SIDE)
       Smooth < 250ms spring scale/fade animations, zero overlap
       ========================================================== */
    .orbit-ramekin {
      position: absolute;
      width: 36px;
      height: 36px;
      z-index: 18;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s ease;
      transform: scale(0);
      opacity: 0;
      pointer-events: none;
    }
    .orbit-ramekin.visible {
      transform: scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    /* 6 Dip slots contained strictly inside the 76px left column */
    .dip-slot-0 { left: 2px; top: 6px; }
    .dip-slot-1 { right: 2px; top: 20px; }
    .dip-slot-2 { left: 2px; top: 54px; }
    .dip-slot-3 { right: 2px; top: 68px; }
    .dip-slot-4 { left: 2px; top: 102px; }
    .dip-slot-5 { right: 2px; top: 116px; }

    /* Dip quantity badge on single bowl */
    .dip-qty-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--brand-orange);
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 900;
      border-radius: 9999px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--bg-midnight);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      z-index: 22;
      animation: popInBadge 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Overflow pill if > 5 distinct dips */
    .dip-overflow-pill {
      position: absolute;
      inset: 0;
      background: rgba(11, 18, 33, 0.94);
      border: 1.5px solid var(--brand-orange);
      border-radius: 50%;
      color: var(--brand-orange);
      font-size: 11px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
      z-index: 23;
    }

    /* ==========================================================
       RIGHT ZONE (SIDES): STACKED VERTICALLY IN FREED RIGHT SPACE
       Consistent generous sizing, zero collision with wings bucket
       ========================================================== */
    .orbit-side-plate {
      position: relative;
      width: 58px;
      height: 58px;
      z-index: 16;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s ease;
      transform: scale(0);
      opacity: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }
    .orbit-side-plate.visible {
      transform: scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    /* Flex-stacked vertically inside 76px right column */
    .side-slot-0 { margin-top: 4px; }
    .side-slot-1 { margin-top: 4px; }

    .side-qty-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--brand-orange);
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 900;
      border-radius: 9999px;
      min-width: 19px;
      height: 19px;
      padding: 0 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--bg-midnight);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      z-index: 22;
      animation: popInBadge 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .side-overflow-pill {
      position: absolute;
      inset: 0;
      background: rgba(11, 18, 33, 0.94);
      border: 1.5px solid var(--brand-orange);
      border-radius: 50%;
      color: var(--brand-orange);
      font-size: 12px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
      z-index: 23;
    }

    @keyframes popInBadge {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    /* Active Sauce Name Badge on Stage (Dedicated Top Row Header inside Tray) */
    .stage-sauce-badge {
      position: relative;
      margin: 0 auto;
      background: rgba(11, 18, 33, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 4px 14px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 800;
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      z-index: 24;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
    }
    .sauce-badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    /* ==========================================================
       LOWER INTERACTIVE CONTROLS (~48% height)
       ========================================================== */
    .controls-container {
      display: flex;
      flex-direction: column;
      padding: 0 14px calc(16px + env(safe-area-inset-bottom, 0px));
      gap: 12px;
    }

    .category-tabs-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-bottom: 2px;
      width: 100%;
    }

    .tab-pill {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 8px;
      border-radius: 9999px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 800;
      font-family: var(--font-cairo);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .tab-pill.active {
      background: #FFFFFF;
      color: #0B1221;
      border-color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
    }

    .tab-counter {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--brand-orange);
      color: white;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Carousel (auto height - do not reserve empty height when promo banner is hidden) */
    .carousel-section {
      margin-top: 6px;
      min-height: auto;
    }

    .carousel-track {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 2px 2px 4px;
      scroll-snap-type: x mandatory;
    }

    /* Circular Item Card */
    .item-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
      width: 82px;
      text-align: center;
      scroll-snap-align: start;
    }

    .item-circle {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: var(--bg-surface);
      border: 2px solid var(--border-subtle);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: visible;
    }
    .item-card:active .item-circle {
      transform: scale(0.92);
    }
    .item-card.selected .item-circle {
      border-color: var(--brand-orange);
      box-shadow: 0 0 16px rgba(249, 78, 30, 0.45);
    }

    .item-badge-check {
      position: absolute;
      top: -2px;
      right: -2px;
      min-width: 20px;
      height: 20px;
      padding: 0 4px;
      border-radius: 9999px;
      background: var(--brand-orange);
      color: white;
      font-size: 11px;
      font-weight: 900;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      z-index: 5;
    }
    .item-card.selected .item-badge-check {
      display: flex;
    }

    .item-btn-minus {
      position: absolute;
      top: -2px;
      left: -2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #FFFFFF;
      color: #0B1221;
      font-size: 13px;
      font-weight: 900;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      z-index: 5;
      transition: transform 0.15s ease;
    }
    .item-btn-minus:active {
      transform: scale(0.85);
    }
    .item-card.selected .item-btn-minus {
      display: flex;
    }

    .item-name {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-white);
      margin-top: 6px;
      line-height: 1.2;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-price {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 248, 240, 0.90);
      margin-top: 2px;
      line-height: 1.3;
      letter-spacing: 0.01em;
    }
    .item-price.free {
      color: #FFF8F0;
      font-weight: 500;
      opacity: 0.95;
    }

    /* Wings Quantity Selector Bar */
    .quantity-pill-bar {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      padding: 3px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2px;
    }

    .qty-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      font-family: var(--font-cairo);
      padding: 6px 0;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    .qty-btn.active {
      background: #FFFFFF;
      color: #0B1221;
      font-weight: 900;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    /* Bottom CTA Button directly below piece-count selector with clean pb-4 padding on container */
    .cta-button {
      width: 100%;
      background: var(--brand-orange);
      color: #FFFFFF;
      border: none;
      border-radius: 9999px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 900;
      font-family: var(--font-cairo);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 20px rgba(249, 78, 30, 0.45);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 0;
    }
    .cta-button:active {
      transform: scale(0.98);
      box-shadow: 0 4px 12px rgba(249, 78, 30, 0.3);
    }

    /* ==========================================================
       READY BOXES VIEW (وجبات جاهزة)
       ========================================================== */
    .ready-boxes-view {
      display: none;
      flex: 1;
      padding: 10px 16px 20px;
      overflow-y: auto;
      gap: 12px;
      flex-direction: column;
    }
    .ready-boxes-view.active {
      display: flex;
    }

    .ready-box-card {
      background: #131E33;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .ready-box-card:hover {
      border-color: rgba(249, 78, 30, 0.4);
      transform: translateY(-2px);
    }

    /* ==========================================================
       CSS-CRAFTED DARK MATTE RESTAURANT SERVING TRAY
       Top-down realistic restaurant tray with raised 3D rim and matte liner
       ========================================================== */
    .serving-tray {
      position: absolute;
      inset: 8px 10px 42px 10px;
      border-radius: 24px;
      background: radial-gradient(ellipse at 50% 45%, #151F33 0%, #0E1626 65%, #0A101C 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      box-shadow: 
        inset 0 2px 4px rgba(255, 255, 255, 0.1),
        inset 0 -2px 6px rgba(0, 0, 0, 0.8),
        0 10px 24px rgba(0, 0, 0, 0.55),
        0 2px 6px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    /* Structured Non-Overlapping Grid Inside Tray */
    .tray-grid-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 6px 6px;
      box-sizing: border-box;
      z-index: 10;
    }

    /* Top Row: Dedicated Header inside Tray for Active Sauce Badge */
    .tray-top-header {
      height: 32px;
      min-height: 32px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      flex-shrink: 0;
    }

    /* Middle Row: Strict 3-Column Grid (76px 1fr 76px) */
    .tray-middle-grid {
      display: grid;
      grid-template-columns: 76px 1fr 76px;
      align-items: center;
      justify-items: center;
      width: 100%;
      flex: 1;
      min-height: 0;
      position: relative;
      direction: ltr; /* Keeps Left column = Dips, Center = Wings, Right = Sides */
    }

    /* Left Column (76px): Dedicated to Side Dips */
    .tray-col-dips {
      width: 76px;
      height: 100%;
      position: relative;
      direction: rtl;
    }

    /* Center Column (1fr): Dedicated to Main Wings Box */
    .tray-col-wings {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-width: 0;
    }

    /* Right Column (76px): Dedicated to Sides (Fries, Coleslaw) */
    .tray-col-sides {
      width: 76px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      direction: rtl;
    }

    /* Subtle Matte Liner Inset framing the meal */
    .tray-liner {
      position: absolute;
      inset: 8px 8px;
      border-radius: 18px;
      border: 1px dashed rgba(255, 255, 255, 0.05);
      background: rgba(255, 255, 255, 0.015);
      pointer-events: none;
      z-index: 2;
    }

    /* Grounded Contact Shadow directly underneath wings box */
    .wings-contact-shadow {
      position: absolute;
      width: 175px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.4) 55%, transparent 75%);
      filter: blur(5px);
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 155px;
      height: 18px;
      pointer-events: none;
      z-index: 9;
      transition: all 0.25s ease;
    }

    /* Contact shadow for dip cups */
    .dip-contact-shadow {
      position: absolute;
      width: 38px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.3) 55%, transparent 75%);
      filter: blur(2px);
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 1;
    }

    /* Contact shadow for side plates (fries, coleslaw) */
    .side-contact-shadow {
      position: absolute;
      width: 62px;
      height: 13px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.3) 55%, transparent 75%);
      filter: blur(3px);
      bottom: -3px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 1;
    }

    

    /* Smart Sauce Transitions: Top-Down Sauce Pour / Glaze Wipe */
    @keyframes saucePourWipe {
      0% {
        clip-path: inset(0 0 100% 0);
        transform: scale(0.96);
      }
      60% {
        clip-path: inset(0 0 10% 0);
        transform: scale(1.03);
      }
      100% {
        clip-path: inset(0 0 0% 0);
        transform: scale(1);
      }
    }
    .real-wing-overlay.sauce-pour-wipe {
      animation: saucePourWipe 0.28s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
    }

    /* Smart Sauce Transitions: Fresh Box Swap */
    @keyframes boxSwapPop {
      0% {
        opacity: 0.2;
        transform: scale(0.94);
      }
      65% {
        opacity: 1;
        transform: scale(1.02);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    .real-wing-overlay.box-swap-transition {
      animation: boxSwapPop 0.22s cubic-bezier(0.34, 1.56, 0.64, 1) forwards !important;
    }

    /* Tactile Drop & Bounce onto Tray */
    @keyframes trayDropBounce {
      0% {
        transform: translateY(-24px) scale(1.15);
        opacity: 0;
      }
      60% {
        transform: translateY(3px) scale(0.97);
        opacity: 1;
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }
    .orbit-ramekin.tray-drop-bounce,
    .orbit-side-plate.tray-drop-bounce {
      animation: trayDropBounce 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Floating Price Feedback Indicator */
    .floating-price-indicator {
      position: fixed;
      z-index: 9999;
      font-family: var(--font-cairo);
      font-size: 13px;
      font-weight: 900;
      color: #FF8A00;
      background: rgba(14, 22, 38, 0.95);
      border: 1px solid rgba(249, 115, 22, 0.45);

    @keyframes floatPriceUp {
      0% {
        opacity: 0;
        transform: translate(-50%, 8px) scale(0.85);
      }
      25% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1.06);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -28px) scale(0.95);
      }

    @keyframes badgeBounce {

    .cart-toast-btn {

    /**
     * IMAGE RESOLUTION HELPER
     * Supports both Vite local server and direct offline file:// opening.
     */
    function resolveImagePath(path) {
      if (!path) return "";
      if (window.location.protocol === 'file:') {
        const cleanPath = path.split('?')[0];
        return cleanPath.startsWith('/') ? 'public' + cleanPath : 'public/' + cleanPath;
      }
      return path;
    }

    function getWingImagePath(sauceId, count) {
      return resolveImagePath(`/images/wings-${sauceId}-${count}.png`);
    }

    /**
     * APPLICATION STATE
     */
    let state = {
      viewMode: "build", // "build" | "ready_boxes"
      wingsCount: 6,
      selectedSauceId: "crispy", // default to crispy
      previousSauceId: "crispy",
      spiceLevel: 1, // 0: mild, 1: medium, 2: extra_hot
      selectedDips: {}, // { [dipId]: quantity }
      selectedSides: {}, // { [sideId]: quantity }
      activeTab: "sauce", // "sauce" | "dips" | "sides"
      cartItems: [], // Multi-Item Shopping Cart
      activeModalBox: null,
      modalSelectedSauceId: "crispy",
      modalSelectedSpiceLevel: 1,
    };

    let currentWingImgLoadedSrc = "";

    /**
     * INITIALIZATION, CART RESTORATION & COMPLETE PNG ASSET PRELOADING
     */
    window.addEventListener("DOMContentLoaded", () => {
      loadCartFromStorage();
      preloadAllAssets();
      renderAll();
      updateCartBadge();
    });

    function loadCartFromStorage() {
      try {
        const saved = localStorage.getItem("mewio_wings_cart_v1");
        if (saved) {
          state.cartItems = JSON.parse(saved);
        }
      } catch (e) {
        console.warn("Could not load cart from storage", e);
      }
    }

    function saveCartToStorage() {
      try {
        localStorage.setItem("mewio_wings_cart_v1", JSON.stringify(state.cartItems));
      } catch (e) {
        console.warn("Could not save cart to storage", e);
      }
    }

    function getCartCount() {
      return state.cartItems.reduce((acc, it) => acc + (it.qty || 1), 0);
    }

    function updateCartBadge() {
      const count = getCartCount();
      const badge = document.getElementById("cartBadgeCount");
      if (badge) {
        badge.innerText = count;
        badge.style.display = count > 0 ? "flex" : "none";
      }
    }

    function triggerCartBounce() {
      const badge = document.getElementById("cartBadgeCount");
      const cartBtn = document.querySelector(".header .icon-btn");
      if (badge) {
        badge.classList.remove("badge-bounce");
        badge.offsetHeight; // trigger reflow
        badge.classList.add("badge-bounce");
      }
      if (cartBtn) {
        cartBtn.classList.remove("badge-bounce");
        cartBtn.offsetHeight;
        cartBtn.classList.add("badge-bounce");
      }
    }

    let toastTimer = null;
    function showToast(message, actionLabel, actionCallback) {
      const toast = document.getElementById("cartToast");
      if (!toast) return;
      const msgEl = document.getElementById("cartToastMsg");
      if (msgEl) msgEl.innerText = message;

      toast.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 3500);
    }

    function showFloatingPriceFeedback(text, evt) {
      const span = document.createElement("span");
      span.className = "floating-price-indicator";
      span.innerText = text;

      let x = window.innerWidth / 2;
      let y = window.innerHeight - 90;
      if (evt && evt.clientX && evt.clientY) {
        x = evt.clientX;
        y = evt.clientY - 22;
      }
      span.style.left = `${x}px`;
      span.style.top = `${y}px`;
      document.body.appendChild(span);
      setTimeout(() => span.remove(), 800);
    }

    /**
     * PRELOAD ALL PNG ASSETS ON APP MOUNT
     * Preloads all 20 wing combinations, all 6 dips, and both sides into memory
     */
    function preloadAllAssets() {
      // 1. All 20 Wings Combinations (4 sauces x 5 counts)
      MENU_CONFIG.coatingSauces.forEach(sauce => {
        MENU_CONFIG.wingCounts.forEach(w => {
          const img = new Image();
          img.src = getWingImagePath(sauce.id, w.count);
        });
      });

      // 2. All 6 Dips
      MENU_CONFIG.dips.forEach(dip => {
        const img = new Image();
        img.src = resolveImagePath(dip.image || `/images/dip-${dip.id}.png`);
      });

      // 3. Both Sides
      MENU_CONFIG.sides.forEach(side => {
        const img = new Image();
        img.src = resolveImagePath(side.image || `/images/side-${side.id}.png`);
      });
    }

    /**
     * DYNAMIC REAL WINGS PNG RENDERER WITH < 250ms TRANSITION
     */
    function renderWingsImage() {
      const img = document.getElementById("realWingImg");
      if (!img) return;

      const targetSrc = getWingImagePath(state.selectedSauceId, state.wingsCount);
      // Subtle proportional scaling between 3 and 20 pieces strictly within the bounding box (82% to 100%)
      const wingScales = { 3: 0.82, 6: 0.88, 9: 0.92, 12: 0.96, 20: 1.0 };
      const currentScale = wingScales[state.wingsCount] || 0.88;

      if (currentWingImgLoadedSrc !== targetSrc) {
        currentWingImgLoadedSrc = targetSrc;
        img.src = targetSrc;

        // Instant snappy switching with lightweight, fast 150ms subtle scale transition
        img.style.transform = `scale(${currentScale * 0.96})`;
        img.offsetHeight; // force reflow
        img.style.transform = `scale(${currentScale})`;
      } else {
        img.style.transform = `scale(${currentScale})`;
      }

      // Grounded contact shadow scale sync
      const shadow = document.getElementById("wingsContactShadow");
      if (shadow) {
        shadow.style.transform = `translateX(-50%) scale(${currentScale})`;
      }

      // Sauce Color Ambient Glow pulse on the tray
      const glowColors = {
        crispy: "rgba(245, 158, 11, 0.22)",
        algeria: "rgba(234, 88, 12, 0.38)",
        bbq: "rgba(180, 83, 9, 0.38)",
        buffalo: "rgba(239, 68, 68, 0.44)"
      };
      const glow = document.getElementById("plateAmbientGlow");
      if (glow) {
        glow.style.background = `radial-gradient(circle, ${glowColors[state.selectedSauceId] || glowColors.crispy} 0%, transparent 70%)`;
      }
    }

    function handleWingImgError(img) {

    function handleWingImgLoad(img) {
      img.style.display = "block";
      img.classList.remove("switching");
      const g = document.getElementById("wingsGroup");
      if (g) g.style.display = "none";
    }

    /**
     * RENDER PROCEDURAL SVG FALLBACK & AMBIENT EFFECTS
     */
    function renderWingsSvg() {
      const g = document.getElementById("wingsGroup");
      const glow = document.getElementById("plateAmbientGlow");
      const steam = document.getElementById("steamGroup");

      const currentSauce = MENU_CONFIG.coatingSauces.find(s => s.id === state.selectedSauceId) || MENU_CONFIG.coatingSauces[0];
      const isPlain = currentSauce.isPlain;

      // Update SVG glaze gradient stops for fallback
      const stop0 = document.getElementById("sauceStop0");
      const stop1 = document.getElementById("sauceStop1");
      const stop2 = document.getElementById("sauceStop2");
      if (stop0 && stop1 && stop2 && !isPlain) {
        stop0.setAttribute("stop-color", currentSauce.stops[0]);
        stop1.setAttribute("stop-color", currentSauce.stops[1]);
        stop2.setAttribute("stop-color", currentSauce.stops[2]);
      }

      // Lighting & Steam VFX
      glow.className = "plate-ambient-glow";
      steam.style.display = "none";

      const currentSpice = MENU_CONFIG.spiceLevels[state.spiceLevel];
      if (currentSpice.glowClass) glow.classList.add(currentSpice.glowClass);
      if (state.spiceLevel === 2 || (!isPlain && currentSauce.hasSteam)) {
        steam.style.display = "block";
      }

      // Fallback SVG Layout
      const wingLayouts = {
        3: [[120, 120, 24, 14, -15, true], [98, 114, 22, 13, 35, false], [142, 118, 23, 14, -40, true]],
        6: [[120, 122, 24, 14, -10, true], [96, 106, 22, 13, 40, false], [144, 104, 23, 14, -45, true], [92, 138, 22, 13, -25, false], [148, 136, 23, 14, 45, true], [120, 92, 21, 13, 15, false]],
        9: [[120, 120, 23, 14, 0, true], [94, 102, 22, 13, 35, false], [146, 100, 22, 14, -40, true], [88, 136, 21, 13, -25, false], [152, 134, 22, 14, 45, true], [120, 88, 21, 13, 15, false], [76, 118, 20, 12, 55, true], [164, 116, 20, 13, -50, false], [120, 148, 21, 13, -10, true]],
        12: [[120, 120, 23, 14, 0, true], [94, 102, 22, 13, 35, false], [146, 100, 22, 14, -40, true], [88, 136, 21, 13, -25, false], [152, 134, 22, 14, 45, true], [120, 88, 21, 13, 15, false], [74, 118, 20, 12, 55, true], [166, 116, 20, 13, -50, false], [120, 150, 21, 13, -10, true], [100, 75, 19, 12, 30, true], [140, 75, 19, 12, -30, false], [120, 112, 21, 13, -15, true]],
        20: [[120, 120, 23, 14, 0, true], [94, 102, 22, 13, 35, false], [146, 100, 22, 14, -40, true], [88, 136, 21, 13, -25, false], [152, 134, 22, 14, 45, true], [120, 88, 21, 13, 15, false], [74, 118, 20, 12, 55, true], [166, 116, 20, 13, -50, false], [120, 150, 21, 13, -10, true], [100, 74, 19, 12, 30, true], [140, 74, 19, 12, -30, false], [72, 94, 19, 12, 45, false], [168, 92, 19, 12, -45, true], [74, 142, 19, 12, -35, true], [166, 140, 19, 12, 35, false], [96, 160, 19, 12, 15, true], [144, 158, 19, 12, -20, false], [108, 114, 21, 13, 10, true], [132, 114, 21, 13, -15, false], [120, 130, 20, 12, 5, true]]
      };

      const wings = wingLayouts[state.wingsCount] || wingLayouts[6];
      let svgHtml = "";

      wings.forEach(([cx, cy, rx, ry, rot, isDrum]) => {
        svgHtml += `
          <ellipse cx="${cx + 2}" cy="${cy + 4}" rx="${rx + 2}" ry="${ry + 1}" 
            transform="rotate(${rot} ${cx} ${cy})" fill="#000000" opacity="0.32" />
          <g transform="rotate(${rot} ${cx} ${cy})">
            <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#crispyWingGrad)" />
            <circle cx="${cx - rx*0.4}" cy="${cy - ry*0.2}" r="3" fill="#FCD34D" opacity="0.7"/>
            <circle cx="${cx + rx*0.3}" cy="${cy + ry*0.1}" r="3.5" fill="#78350F" opacity="0.6"/>
            <circle cx="${cx - rx*0.1}" cy="${cy + ry*0.3}" r="2.5" fill="#D97706" opacity="0.8"/>
            <circle cx="${cx + rx*0.1}" cy="${cy - ry*0.3}" r="3" fill="#FDE68A" opacity="0.6"/>
            ${isDrum ? `<ellipse cx="${cx + rx - 2}" cy="${cy}" rx="3.5" ry="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>` : ''}
        `;

        if (!isPlain) {
          svgHtml += `
            <ellipse class="wing-glaze-layer" cx="${cx}" cy="${cy}" rx="${rx - 1}" ry="${ry - 1}" fill="url(#sauceGlazeGrad)" opacity="0.94" />
            <path d="M ${cx - rx*0.5} ${cy - ry*0.4} Q ${cx} ${cy - ry*0.7} ${cx + rx*0.4} ${cy - ry*0.3}" 
              stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.65" />
          `;
        }

        svgHtml += `</g>`;
      });

      g.innerHTML = svgHtml;
    }

    function updateStageSauceBadge() {

      const badgeDot = document.getElementById("stageSauceBadgeDot");

      const sauce = MENU_CONFIG.coatingSauces.find(s => s.id === state.selectedSauceId);

    /**
     * DEDICATED LEFT DIPS ZONE (DIRECT PNG RENDERING WITH KEY STABILIZATION)
     * - Zero SVG fallback flash: renders <img> directly
     * - Key stabilization: when quantity changes, only badge updates; <img> remains mounted and rock-steady
     */
    function renderOrbitingDips() {
      const distinctDipIds = Object.keys(state.selectedDips).filter(id => state.selectedDips[id] > 0);
      const maxSlots = 6;

      for (let i = 0; i < maxSlots; i++) {
        const el = document.getElementById("orbitRamekin" + i);
        if (!el) continue;

        if (i < distinctDipIds.length) {
          const dipId = distinctDipIds[i];
          const qty = state.selectedDips[dipId];
          const dipObj = MENU_CONFIG.dips.find(d => d.id === dipId) || MENU_CONFIG.dips[0];
          const imgPath = resolveImagePath(dipObj.image || `/images/dip-${dipObj.id}.png`);

          const wasHidden = !el.classList.contains("visible");

          // Key Check: if slot already displays this exact item.id, ONLY update badge text without re-mounting <img>
          if (el.dataset.itemId === dipId) {
            updateOrCreateBadge(el, qty, "dip-qty-badge");
          } else {
            el.dataset.itemId = dipId;
            el.innerHTML = `
              <div class="dip-contact-shadow"></div>
              <img src="${imgPath}" alt="${dipObj.name}" class="stage-dip-img" style="width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.55)); position: relative; z-index: 2;" />
              ${qty > 1 ? `<span class="dip-qty-badge">×${qty}</span>` : ""}
            `;
          }
          el.classList.add("visible");
          if (wasHidden) {
            el.classList.add("tray-drop-bounce");
            setTimeout(() => el.classList.remove("tray-drop-bounce"), 350);
          }
        } else {
          el.classList.remove("visible", "tray-drop-bounce");
          el.dataset.itemId = "";
          el.innerHTML = "";
        }
      }
    }

    /**
     * DEDICATED RIGHT SIDES ZONE (DIRECT PNG RENDERING WITH KEY STABILIZATION)
     * - Zero SVG fallback flash: renders <img> directly
     * - Key stabilization: when quantity changes, only badge updates; <img> remains mounted and rock-steady
     */
    function renderOrbitingSides() {
      const distinctSideIds = Object.keys(state.selectedSides).filter(id => state.selectedSides[id] > 0);
      const maxSlots = 2;

      for (let i = 0; i < maxSlots; i++) {
        const el = document.getElementById("orbitSidePlate" + i);
        if (!el) continue;

        if (i < distinctSideIds.length) {
          const sideId = distinctSideIds[i];
          const qty = state.selectedSides[sideId];
          const sideObj = MENU_CONFIG.sides.find(s => s.id === sideId) || MENU_CONFIG.sides[0];
          const imgPath = resolveImagePath(sideObj.image || `/images/side-${sideObj.id}.png`);

          const wasHidden = !el.classList.contains("visible");

          // Key Check: if slot already displays this exact item.id, ONLY update badge text without re-mounting <img>
          if (el.dataset.itemId === sideId) {
            updateOrCreateBadge(el, qty, "side-qty-badge");
          } else {
            el.dataset.itemId = sideId;
            el.innerHTML = `
              <div class="side-contact-shadow"></div>
              <img src="${imgPath}" alt="${sideObj.name}" class="stage-side-img" style="width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 18px rgba(0,0,0,0.6)); position: relative; z-index: 2;" />
              ${qty > 1 ? `<span class="side-qty-badge">×${qty}</span>` : ""}
            `;
          }
          el.classList.add("visible");
          if (wasHidden) {
            el.classList.add("tray-drop-bounce");
            setTimeout(() => el.classList.remove("tray-drop-bounce"), 350);
          }
        } else {
          el.classList.remove("visible", "tray-drop-bounce");
          el.dataset.itemId = "";
          el.innerHTML = "";
        }
      }
    }

    /**
     * HELPER: UPDATE OR CREATE QUANTITY BADGE WITHOUT TOUCHING <img>
     */
    function updateOrCreateBadge(container, qty, badgeClass) {
      let badge = container.querySelector("." + badgeClass);
      if (qty > 1) {
        if (!badge) {
          badge = document.createElement("span");
          badge.className = badgeClass;
          container.appendChild(badge);
        }
        if (badge.innerText !== `×${qty}`) {
          badge.innerText = `×${qty}`;
          // Fast pulse animation on quantity change while keeping <img> steady
          badge.style.animation = "none";
          badge.offsetHeight; // trigger reflow
          badge.style.animation = "popInBadge 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)";
        }
      } else {
        if (badge) badge.remove();
      }
    }

    /**
     * TABS & CAROUSEL RENDERING
     */
    function setActiveTab(tab) {
      state.activeTab = tab;
      renderTabs();
      renderCarousel();
    }

    function renderTabs() {
      ["sauce", "dips", "sides"].forEach(t => {
        const el = document.getElementById("tab" + capitalize(t));
        if (el) el.classList.toggle("active", state.activeTab === t);
      });

      const badgeSauce = document.getElementById("badgeSauceCount");
      const badgeDips = document.getElementById("badgeDipsCount");
      const badgeSides = document.getElementById("badgeSidesCount");

      badgeSauce.innerText = "1";
      badgeSauce.style.display = "flex";

      const totalDipsCount = Object.values(state.selectedDips).reduce((a, b) => a + b, 0);
      if (totalDipsCount > 0) {
        badgeDips.style.display = "flex";
        badgeDips.innerText = totalDipsCount;
      } else {
        badgeDips.style.display = "none";
      }

      const totalSidesCount = Object.values(state.selectedSides).reduce((a, b) => a + b, 0);

        badgeSides.style.display = "flex";
        badgeSides.innerText = totalSidesCount;

    // Centralized updateCartBadge() is active

    function renderCarousel() {
      const track = document.getElementById("carouselTrack");

      if (state.activeTab === "sauce") {
        renderSauceCarousel(track);
      } else if (state.activeTab === "dips") {
        renderDipsCarousel(track);
      } else if (state.activeTab === "sides") {
        renderSidesCarousel(track);
      }

    /**
     * DIPS CAROUSEL (MULTI-SELECT & UNLIMITED QUANTITIES)
     */
    function renderDipsCarousel(track) {
      const currentWingsObj = MENU_CONFIG.wingCounts.find(w => w.count === state.wingsCount) || MENU_CONFIG.wingCounts[1];
      const freeAllowance = currentWingsObj.freeDips;
      const totalSelectedDips = Object.values(state.selectedDips).reduce((a, b) => a + b, 0);

      MENU_CONFIG.dips.forEach(dip => {
        const qty = state.selectedDips[dip.id] || 0;
        const isSelected = qty > 0;
        const isFree = totalSelectedDips < freeAllowance;
        const priceLabel = isFree ? "مجاني" : `+${MENU_CONFIG.rules.extraDipPrice} دج`;
        const imgPath = resolveImagePath(dip.image || `/images/dip-${dip.id}.png`);

        const card = document.createElement("div");
        card.className = "item-card" + (isSelected ? " selected" : "");

        card.innerHTML = `
          <div class="item-circle">
            <span class="item-badge-check">${qty > 1 ? `×${qty}` : '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>'}</span>
            <span class="item-btn-minus" onclick="handleDecrementDip(event, '${dip.id}')">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </span>
            <img src="${imgPath}" alt="${dip.name}"
                 style="width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));" />
          </div>
          <div class="item-name">${dip.name}</div>
          <div class="item-price ${isFree ? 'free' : ''}">${priceLabel}</div>
        `;

        card.onclick = (e) => {
          if (e.target.classList.contains("item-btn-minus") || e.target.closest(".item-btn-minus")) return;
          const currentTotalDips = Object.values(state.selectedDips).reduce((a, b) => a + b, 0);
          const wingsObj = MENU_CONFIG.wingCounts.find(w => w.count === state.wingsCount) || MENU_CONFIG.wingCounts[1];
          if (currentTotalDips >= wingsObj.freeDips) {
            showFloatingPriceFeedback(`+${MENU_CONFIG.rules.extraDipPrice} دج`, e);
          }
          state.selectedDips[dip.id] = (state.selectedDips[dip.id] || 0) + 1;
          renderAll();
        };

        track.appendChild(card);
      });
    }

    function handleDecrementDip(e, dipId) {
      e.stopPropagation();
      if (!state.selectedDips[dipId]) return;
      if (state.selectedDips[dipId] > 1) {
        state.selectedDips[dipId]--;
      } else {
        delete state.selectedDips[dipId];
      }
      renderAll();
    }

     * SIDES CAROUSEL (MULTI-SELECT & UNLIMITED QUANTITIES)
     */
    function renderSidesCarousel(track) {
      MENU_CONFIG.sides.forEach(side => {
        const qty = state.selectedSides[side.id] || 0;

        const imgPath = resolveImagePath(side.image || `/images/side-${side.id}.png`);

        const card = document.createElement("div");

          <div class="item-circle">

            <span class="item-btn-minus" onclick="handleDecrementSide(event, '${side.id}')">

        boxId: boxObj.id,

        spiceTitle: spiceObj ? spiceObj.title : "حار",

        qty: 1,

    /**
     * ADD CURRENT CUSTOM CONFIGURED MEAL TO CART
     */
    function handleAddToCart(event) {
      const wingsObj = MENU_CONFIG.wingCounts.find(w => w.count === state.wingsCount) || MENU_CONFIG.wingCounts[1];
      const sauceObj = MENU_CONFIG.coatingSauces.find(s => s.id === state.selectedSauceId) || MENU_CONFIG.coatingSauces[0];
      const spiceObj = MENU_CONFIG.spiceLevels[state.spiceLevel];
      const mealUnitPrice = calculateBuildMealTotal();

      const itemDips = { ...state.selectedDips };
      const itemSides = { ...state.selectedSides };

      const cartItem = {
        cartItemId: "custom_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5),
        type: "custom",
        title: `وجبة ${wingsObj.label} (${sauceObj.name})`,
        wingsCount: state.wingsCount,
        wingsLabel: wingsObj.label,
        sauceId: sauceObj.id,
        sauceName: sauceObj.name,
        spiceLevel: state.spiceLevel,
        spiceTitle: spiceObj.title,
        spiceColor: spiceObj.color,
        selectedDips: itemDips,
        selectedSides: itemSides,
        qty: 1,
        unitPrice: mealUnitPrice,
      };

      state.cartItems.push(cartItem);
      saveCartToStorage();
      updateCartBadge();
      triggerCartBounce();
      showToast("تمت إضافة الوجبة إلى السلة بنجاح", "عرض السلة", () => openOrderDrawer());

      // Reset optional dips and sides for next build
      state.selectedDips = {};
      state.selectedSides = {};
      renderOrbitingDips();
      renderOrbitingSides();
      renderTabs();
      renderCarousel();
      updateLivePrice();
    }

    /**
     * LIVE PRICE CALCULATION (INCLUDING 200 DZD DELIVERY)
     */
    function calculateBuildMealTotal() {
      const wingsObj = MENU_CONFIG.wingCounts.find(w => w.count === state.wingsCount) || MENU_CONFIG.wingCounts[1];
      let total = wingsObj.price;

      const freeDips = wingsObj.freeDips;
      const totalDipsCount = Object.values(state.selectedDips).reduce((a, b) => a + b, 0);
      const extraDipsCount = Math.max(0, totalDipsCount - freeDips);
      total += extraDipsCount * MENU_CONFIG.rules.extraDipPrice;

      Object.entries(state.selectedSides).forEach(([id, qty]) => {
        const sideObj = MENU_CONFIG.sides.find(s => s.id === id);
        if (sideObj) total += sideObj.price * qty;
      });

      return total;
    }

    function calculateCartSubtotal() {
      return state.cartItems.reduce((acc, item) => acc + (item.unitPrice * (item.qty || 1)), 0);
    }

    function calculateGrandTotal() {
      const subtotal = calculateCartSubtotal();
      return subtotal > 0 ? (subtotal + MENU_CONFIG.rules.deliveryFee) : 0;
    }

    function updateLivePrice() {
      const currentMealPrice = calculateBuildMealTotal();
      const ctaPriceEl = document.getElementById("ctaPriceText");
      if (ctaPriceEl) ctaPriceEl.innerText = `${currentMealPrice.toLocaleString("fr-DZ")} دج`;

      const drawerFee = document.getElementById("drawerDeliveryFeeText");
      if (drawerFee) drawerFee.innerText = `${MENU_CONFIG.rules.deliveryFee} دج`;
    }

    /**
     * ORDER SUMMARY DRAWER & REAL-TIME VALIDATION
     */
    function openOrderDrawer() {
      document.getElementById("drawerCheckoutState").style.display = "block";
      document.getElementById("drawerSuccessState").style.display = "none";

      const overlay = document.getElementById("orderDrawerOverlay");
      overlay.classList.add("open");

      const content = document.getElementById("drawerSummaryContent");
      const customerSection = document.querySelector(".customer-form-section");
      const deliveryBanner = document.querySelector(".delivery-banner");
      const submitBtn = document.getElementById("btnSubmitOrder");

      if (state.cartItems.length === 0) {
        // Empty Cart State
        content.innerHTML = `
          <div class="cart-empty-state">
            <div class="empty-icon-circle">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--brand-orange)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>

                <path d="M16 10a4 4 0 0 1-8 0"></path>
              </svg>

            <div class="empty-title">سلة طلباتك فارغة</div>

            <button type="button" class="empty-back-btn" onclick="closeOrderDrawer()">تصفح القائمة</button>

      let subtotal = 0;

      state.cartItems.forEach(item => {
        const lineTotal = item.unitPrice * (item.qty || 1);

        let detailsHtml = "";

              const q = item.selectedSides[sId];

                const sObj = MENU_CONFIG.sides.find(x => x.id === sId);
                sidesArr.push(`${sObj ? sObj.name : sId} ${q > 1 ? `(×${q})` : ''}`);
              }
            });
          }

          detailsHtml = `
            <div class="cart-item-details">
              <div>صوص الأجنحة: <strong>${item.sauceName}</strong> • <span style="color:${item.spiceColor};">${item.spiceTitle}</span></div>
              ${dipsArr.length > 0 ? `<div>الصوصات: ${dipsArr.join(" + ")}</div>` : ''}

          detailsHtml = `
            <div class="cart-item-details">
              <div>${item.boxCode} • صوص <strong>${item.sauceName}</strong> • <span style="color:${item.spiceColor};">${item.spiceTitle}</span></div>
              <div>يتضمن: ${item.includesSummary}</div>

        itemsHtml += `

              <div class="cart-item-price">${lineTotal.toLocaleString("fr-DZ")} دج</div>

            ${detailsHtml}
            <div class="cart-item-controls">
              <div class="cart-stepper">
                <button type="button" class="cart-stepper-btn" onclick="handleUpdateCartItemQty('${item.cartItemId}', -1)">−</button>
                <span class="cart-qty-value">${item.qty || 1}</span>
                <button type="button" class="cart-stepper-btn" onclick="handleUpdateCartItemQty('${item.cartItemId}', 1)">+</button>
              </div>
              <button type="button" class="cart-item-delete" onclick="handleRemoveCartItem('${item.cartItemId}')" title="حذف الوجبة">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  <line x1="10" y1="11" x2="10" y2="17"></line>
                  <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
              </button>
            </div>
          </div>
        `;
      });

      const deliveryFee = MENU_CONFIG.rules.deliveryFee;
      const grandTotal = subtotal + deliveryFee;

      itemsHtml += `
        <div style="margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px;">
          <div class="drawer-item-row">
            <span class="drawer-item-label">المجموع الفرعي:</span>
            <span class="drawer-item-value">${subtotal.toLocaleString("fr-DZ")} دج</span>
          </div>
          <div class="drawer-item-row" style="margin-top: 4px;">
            <span class="drawer-item-label">التوصيل (المدية):</span>
            <span class="drawer-item-value" style="color: var(--brand-orange);">${deliveryFee} دج</span>
          </div>
          <div class="drawer-item-row" style="margin-top: 6px; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 8px;">
            <span class="drawer-item-label" style="font-weight: 900; color: white;">المجموع الكلي للدفع:</span>
            <span class="drawer-item-value" style="color: var(--brand-orange); font-size: 17px; font-weight: 900;">
              ${grandTotal.toLocaleString("fr-DZ")} دج
            </span>
          </div>
        </div>
      `;

      content.innerHTML = itemsHtml;
      if (submitBtn) {
        submitBtn.innerHTML = `
          <span>تأكيد الطلب الآن</span>
          <span>(${grandTotal.toLocaleString("fr-DZ")} دج)</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        `;
      }
    }

    function handleUpdateCartItemQty(cartItemId, delta) {
      const item = state.cartItems.find(it => it.cartItemId === cartItemId);
      if (!item) return;

      if ((item.qty || 1) + delta <= 0) {
        handleRemoveCartItem(cartItemId);
        return;
      }

      item.qty = (item.qty || 1) + delta;
      saveCartToStorage();
      updateCartBadge();
      openOrderDrawer();
    }

    function handleRemoveCartItem(cartItemId) {
      state.cartItems = state.cartItems.filter(it => it.cartItemId !== cartItemId);
      saveCartToStorage();
      updateCartBadge();
      openOrderDrawer();
    }

    function closeOrderDrawer() {
      document.getElementById("orderDrawerOverlay").classList.remove("open");
    }

    function handleOverlayClick(e) {
      if (e.target.id === "orderDrawerOverlay") closeOrderDrawer();
    }

    /**
     * REAL-TIME FORM INPUT HANDLERS
     */
    function handlePhoneInput(input) {
      input.classList.remove("input-error");
      const errEl = document.getElementById("errorPhone");
      if (errEl) {
        errEl.classList.remove("visible");
        errEl.innerText = "";
      }
    }

    function handleAddressInput(input) {
      input.classList.remove("input-error");
      const errEl = document.getElementById("errorAddress");
      if (errEl) {
        errEl.classList.remove("visible");
        errEl.innerText = "";
      }
    }

    function showError(inputId, errorId, message) {
      const input = document.getElementById(inputId);
      const errorEl = document.getElementById(errorId);
      if (input) input.classList.add("input-error");
      if (errorEl) {
        errorEl.innerText = message;
        errorEl.classList.add("visible");
      }
    }

    /**
     * ORDER CONFIRMATION & STRICT ALGERIAN VALIDATION
     */
    function handleConfirmOrder() {
      const phoneInput = document.getElementById("customerPhoneInput");
      const addressInput = document.getElementById("customerAddressInput");
      const notesInput = document.getElementById("customerNotesInput");

      const rawPhone = phoneInput.value.trim();
      const rawAddress = addressInput.value.trim();
      const notes = notesInput ? notesInput.value.trim() : "";

      const cleanPhone = rawPhone.replace(/[\s\-\.\(\)]/g, "");
      let hasError = false;
      let firstInvalidInput = null;

      // Validate Phone Number (Algerian Format: 10 digits starting with 05, 06, or 07)
      if (!cleanPhone) {
        showError("customerPhoneInput", "errorPhone", "يرجى إدخال رقم الهاتف للتواصل معك لتسليم الطلب");
        hasError = true;
        if (!firstInvalidInput) firstInvalidInput = phoneInput;
      } else if (!/^(05|06|07)[0-9]{8}$/.test(cleanPhone)) {
        showError("customerPhoneInput", "errorPhone", "رقم هاتف جزائري غير صحيح. يجب أن يتكون من 10 أرقام ويبدأ بـ 05 أو 06 أو 07");
        hasError = true;
        if (!firstInvalidInput) firstInvalidInput = phoneInput;
      }

      // Validate Delivery Address
      if (!rawAddress || rawAddress.length < 4) {
        showError("customerAddressInput", "errorAddress", "يرجى كتابة عنوان التوصيل بالتفصيل (الحي، الشارع، المعلم بالمدية)");
        hasError = true;
        if (!firstInvalidInput) firstInvalidInput = addressInput;
      }

      if (hasError) {
        if (firstInvalidInput) {
          firstInvalidInput.scrollIntoView({ behavior: "smooth", block: "center" });
          firstInvalidInput.focus();
        }
        return;
      }

      if (state.cartItems.length === 0) {
        alert("سلة طلباتك فارغة! أضف وجبة أولاً.");
        return;
      }

      const orderId = Math.floor(100000 + Math.random() * 900000);
      const subtotal = calculateCartSubtotal();
      const grandTotal = subtotal + MENU_CONFIG.rules.deliveryFee;

      // Build WhatsApp Message (Clean, professional, zero emojis)
      let msg = `*طلب جديد من مطعم WINGS (المدية)*\n`;
      msg += `------------------------------------\n`;
      msg += `• رقم الطلب: #${orderId}\n`;
      msg += `• نوع الخدمة: توصيل سريع داخل ولاية المدية\n`;
      msg += `• رقم الهاتف: ${cleanPhone}\n`;
      msg += `• عنوان التوصيل: ${rawAddress}\n`;
      if (notes) msg += `• ملاحظات: ${notes}\n`;
      msg += `------------------------------------\n`;
      msg += `• وجبات الطلب (${getCartCount()}):\n`;

      state.cartItems.forEach((item, index) => {
        const lineTotal = item.unitPrice * (item.qty || 1);
        if (item.type === "custom") {
          msg += `[${index + 1}] ${item.title} (×${item.qty || 1}) — ${lineTotal} دج\n`;
          msg += `    - درجة الحرارة: ${item.spiceTitle}\n`;

          const distinctDips = item.selectedDips ? Object.keys(item.selectedDips).filter(id => item.selectedDips[id] > 0) : [];
          if (distinctDips.length > 0) {
            const dipsStr = distinctDips.map(id => {
              const d = MENU_CONFIG.dips.find(x => x.id === id);
              return `${d ? d.name : id} ×${item.selectedDips[id]}`;
            }).join(", ");
            msg += `    - الصوصات: ${dipsStr}\n`;
          }

          const distinctSides = item.selectedSides ? Object.keys(item.selectedSides).filter(id => item.selectedSides[id] > 0) : [];
          if (distinctSides.length > 0) {
            const sidesStr = distinctSides.map(id => {
              const s = MENU_CONFIG.sides.find(x => x.id === id);
              return `${s ? s.name : id} ×${item.selectedSides[id]}`;
            }).join(", ");
            msg += `    - الإضافات: ${sidesStr}\n`;
          }
        } else {
          msg += `[${index + 1}] ${item.title} (${item.boxCode}) (×${item.qty || 1}) — ${lineTotal} دج\n`;
          msg += `    - صوص: ${item.sauceName} • درجة الحرارة: ${item.spiceTitle}\n`;
        }
      });

      msg += `------------------------------------\n`;
      msg += `• المجموع الفرعي: ${subtotal.toLocaleString("fr-DZ")} دج\n`;
      msg += `• رسوم التوصيل (المدية): ${MENU_CONFIG.rules.deliveryFee} دج\n`;
      msg += `• المجموع النهائي للدفع: *${grandTotal.toLocaleString("fr-DZ")} دج*\n`;
      msg += `------------------------------------\n`;
      msg += `شكراً لاختياركم مطعم WINGS!`;

      const whatsappUrl = `https://api.whatsapp.com/send?phone=${MENU_CONFIG.restaurant.whatsapp}&text=${encodeURIComponent(msg)}`;

      // Clear Cart Upon Successful Order
      const orderedItems = [...state.cartItems];
      state.cartItems = [];
      saveCartToStorage();
      updateCartBadge();

      renderOrderSuccessScreen(orderId, cleanPhone, rawAddress, notes, grandTotal, whatsappUrl, orderedItems);
    }

    function renderOrderSuccessScreen(orderId, phone, address, notes, total, whatsappUrl, orderedItems) {
      document.getElementById("drawerCheckoutState").style.display = "none";
      const successEl = document.getElementById("drawerSuccessState");
      successEl.style.display = "block";

      let itemsRecapHtml = "";
      if (orderedItems && orderedItems.length > 0) {
        itemsRecapHtml = `
          <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 800;">الوجبات المطلوبة:</div>
        `;
        orderedItems.forEach(it => {
          itemsRecapHtml += `
            <div class="drawer-item-row" style="font-size: 12px;">
              <span class="drawer-item-label">${it.title} (×${it.qty || 1}):</span>
              <span class="drawer-item-value">${(it.unitPrice * (it.qty || 1)).toLocaleString("fr-DZ")} دج</span>
            </div>
          `;
        });
      }

      successEl.innerHTML = `
        <div class="success-screen">
          <div class="success-icon-wrap">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--brand-orange)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
          </div>

          <h2 class="success-title">تم تسجيل طلبك بنجاح!</h2>
          <div class="success-order-num">رقم الطلب: #${orderId}</div>

          <p class="success-delivery-pill">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-2px;margin-left:4px;">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            وقت التوصيل المقدر: 30 - 45 دقيقة (ولاية المدية)
          </p>

          <div class="success-recap-card">
            <div style="font-size: 13px; font-weight: 800; color: #FFFFFF; margin-bottom: 8px;">
              بيانات التوصيل والطلب:
            </div>
            ${itemsRecapHtml}
            <div class="drawer-item-row" style="margin-top: 6px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 6px;">
              <span class="drawer-item-label">الهاتف:</span>
              <span class="drawer-item-value" dir="ltr">${phone}</span>
            </div>
            <div class="drawer-item-row">
              <span class="drawer-item-label">العنوان:</span>
              <span class="drawer-item-value">${address}</span>
            </div>
            ${notes ? `
              <div class="drawer-item-row">
                <span class="drawer-item-label">ملاحظات:</span>
                <span class="drawer-item-value">${notes}</span>
              </div>
            ` : ''}
            <div class="drawer-item-row" style="margin-top: 6px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px;">
              <span class="drawer-item-label" style="font-weight: 800; color: white;">المبلغ للدفع عند الاستلام:</span>
              <span class="drawer-item-value" style="color: var(--brand-orange); font-size: 16px; font-weight: 900;">
                ${total.toLocaleString("fr-DZ")} دج
              </span>
            </div>
          </div>

          <a href="${whatsappUrl}" target="_blank" class="whatsapp-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
            </svg>
            <span>إرسال وتأكيد الطلب عبر واتساب</span>
          </a>

          <button class="new-order-btn" onclick="handleNewOrder()" style="display:flex;align-items:center;justify-content:center;gap:8px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10"></polyline>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
            <span>طلب وجبة جديدة</span>
          </button>
        </div>
      `;
    }

    function handleNewOrder() {
      handleResetMenu();
      state.cartItems = [];
      saveCartToStorage();
      updateCartBadge();
      const phoneInput = document.getElementById("customerPhoneInput");
      const addressInput = document.getElementById("customerAddressInput");
      const notesInput = document.getElementById("customerNotesInput");
      if (phoneInput) phoneInput.value = "";
      if (addressInput) addressInput.value = "";
      if (notesInput) notesInput.value = "";
      closeOrderDrawer();
    }

    function handleResetMenu() {
      state.wingsCount = 6;
      state.selectedSauceId = "crispy";
      state.previousSauceId = "crispy";
      state.spiceLevel = 1;
      state.selectedDips = {};
      state.selectedSides = {};
      state.activeTab = "sauce";
      currentWingImgLoadedSrc = "";
      renderAll();
    }

    function handleGoBack() {
      if (confirm("هل ترغب في إعادة ضبط الوجبة والعودة للبداية؟")) {
        handleResetMenu();
      }
    }

    function capitalize(s) {
      return s.charAt(0).toUpperCase() + s.slice(1);
    }
  </script>
</body>
</html>
